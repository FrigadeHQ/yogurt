name: Desktop interface screenshots

on:
  push:
    branches: ['ci/interface-review', 'ci/interface-review/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-interface-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 65
    env:
      YOGURT_BACKGROUND: '0'
      TZ: UTC
      YOGURT_INTERFACE_IMAGES: ${{ github.workspace }}/screenshots
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
          fetch-depth: 0
      - name: Prepare matching before and after builds
        run: |
          base=$(git -C current merge-base origin/main HEAD)
          git -C current worktree add --detach "$GITHUB_WORKSPACE/baseline" "$base"
          cp current/app/e2e/interfaceScreenshots.spec.ts baseline/app/e2e/
          echo "YOGURT_INTERFACE_DAY=$(date -u +%F)" >> "$GITHUB_ENV"
          mkdir -p "$YOGURT_INTERFACE_IMAGES"
          {
            echo "Before $base"
            echo "After $(git -C current rev-parse HEAD)"
            echo "Run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$YOGURT_INTERFACE_IMAGES/revisions.txt"
      - run: sudo xcode-select -s /Applications/Xcode_26.4.1.app
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: current/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: current/.nvmrc
          cache: pnpm
          cache-dependency-path: current/pnpm-lock.yaml
      - name: Capture both app revisions
        shell: bash
        run: |
          capture() (
            set -e
            cd "$1"
            export YOGURT_INTERFACE_STAGE="$2"
            pnpm install --frozen-lockfile
            pnpm -C app native
            pnpm -C app exec electron-vite build
            pnpm -C app exec playwright test interfaceScreenshots.spec.ts --workers=1
          )
          set +e
          capture baseline before
          before=$?
          capture current after
          after=$?
          exit $((before || after))
      - name: Verify the screenshot set
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os, struct
          root = Path(os.environ['YOGURT_INTERFACE_IMAGES'])
          ids = '01 01-general 01-updates 02 02-partial 03 04 04-folder 04-trash 04-retained 04-search 04-setup 04-folders 04-note 04-transcript 04-folder-retained 04-trash-retained 04-note-retained 04-transcript-retained 13-delete note-stop 06 07 07-reach 08 09 10 10-panel 10-history 10-thread 10-answer calendar-event 12 12-ask 13 13-partial 13-absent 15 17 17-valid 18 19 note-save summary regenerate upload-read'.split()
          expected = [f'{i}-{s}-{t}.png' for i in ids for s in ('before', 'after') for t in ('light', 'dark')]
          missing = [name for name in expected if not (root / name).is_file()]
          images, errors = {}, []
          for name in expected:
              if name in missing:
                  continue
              data = (root / name).read_bytes()
              if len(data) < 24 or not data.startswith(bytes.fromhex('89504e470d0a1a0a')) or data[12:16] != b'IHDR':
                  errors.append(f'{name}: invalid PNG header')
                  continue
              images[name] = struct.unpack('>II', data[16:24])
          for i in ids:
              for t in ('light', 'dark'):
                  before, after = (images.get(f'{i}-{s}-{t}.png') for s in ('before', 'after'))
                  if before and after and before != after:
                      errors.append(f'{i} {t}: window size changed from {before} to {after}')
          reference = None
          for stage in ('before', 'after'):
              for theme in ('light', 'dark'):
                  name = f'07-frame-{stage}-{theme}.json'
                  if not (root / name).is_file():
                      errors.append(f'{name}: missing agenda geometry')
                      continue
                  geometry = json.loads((root / name).read_text())
                  if reference is not None and geometry != reference:
                      errors.append(f'{name}: agenda bounds or starting header moved: {geometry} vs {reference}')
                  reference = geometry
          (root / 'manifest.json').write_text(json.dumps({'source': 'Electron webContents.capturePage', 'images': images, 'missing': missing, 'errors': errors}, indent=2))
          if missing or errors:
              raise SystemExit('\n'.join([*missing, *errors]))
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: desktop-interface-screenshots
          path: screenshots/
          if-no-files-found: error
          retention-days: 14
