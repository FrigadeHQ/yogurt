appId: so.yogurt.app
productName: Yogurt
copyright: Copyright © 2026 Frigade
# GitHub Releases: every v* tag builds Mac, Windows and Linux (.github/workflows/release.yml).
# Fixed file names, so releases/latest/download/Yogurt-mac-arm64.dmg (and the Windows and Linux ones) point at the newest.
# Installed copies update from the same release (latest-mac.yml, latest.yml, latest-linux.yml; src/main/updates.ts).
# The website links the .dmg and, on Windows and Linux, the -setup copies release.yml adds; latest*.yml keep these names.
publish:
  provider: github
  owner: FrigadeHQ
  repo: yogurt
  releaseType: release
extraMetadata:
  name: yogurt
directories:
  # dist/ only: with another output folder electron-builder packs the whole project
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  # the helpers (scripts/native.mjs): on a Mac native.sh's calendar, call detection and names in calls, recording,
  # speech to text; on Windows and Linux the Rust recorder, system helper and AI apps relay, and whisper-server
  - from: resources/bin
    to: bin
  # Silero VAD for whisper-server (native.sh or whisper-build.mjs fetch it, checked against its sha256)
  - from: resources/vad
    to: vad
  # the Mac's menu bar icon (tray.ts reads it from Resources; @2x is picked up next to it)
  - { from: resources, to: ., filter: ["tray.png", "tray@2x.png", "tray-titled.png", "tray-titled@2x.png"] }
  # licenses of things bundled or downloaded: fonts, whisper.cpp, Silero VAD, libopus, the native recorders' crates,
  # whisper-server's headers, animate-ui, the CUDA runtime and the echo canceller (webrtcaec3.js)
  - from: resources/licenses
    to: licenses
  # the Mac's About window shows Resources/Credits.html under the version, with its link
  - from: resources/about/Credits.html
    to: Credits.html
# Electron's switches a shipped app doesn't need, off so nobody can run it as plain Node or attach a debugger to it;
# the app loads only from its own app.asar, checked against the hash in Info.plist.
# Local debugging can enable the inspector with YOGURT_FUSES=0 in scripts/release-mac.sh.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
# Linux: `yogurt` becomes a launcher that starts Electron on X11 on a Wayland desktop (build/linux-launcher.sh)
afterPack: scripts/linux-launcher.cjs
asarUnpack:
  # the notes model's engine loads native binaries; they can't run from inside the asar archive
  - "**/node_modules/node-llama-cpp/**"
  - "**/node_modules/@node-llama-cpp/**"
mac:
  # a platform's files list replaces the one above, so it repeats it
  files:
    - out/**
    - package.json
    # this Mac build only needs the Apple Silicon engine binaries
    - "!**/node_modules/@node-llama-cpp/{linux,win,mac-x64}*/**"
    - "!**/node_modules/node-llama-cpp/bins/{linux,win,mac-x64}*/**"
  artifactName: Yogurt-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64]
    # what an installed Yogurt downloads to update itself (src/main/updates.ts)
    - target: zip
      arch: [arm64]
  icon: build/icon.icns
  category: public.app-category.productivity
  # Core Audio process taps (the call's sound) and their permission prompt arrived in 14.4
  minimumSystemVersion: "14.4"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  # Electron's own helpers; each program in Resources/bin gets its own set (scripts/sign.cjs)
  entitlementsInherit: build/entitlements.mac.inherit.plist
  sign: scripts/sign.cjs
  extendInfo:
    # a Dock app, with its menu bar icon too
    LSUIElement: false
    NSMicrophoneUsageDescription: Yogurt records your voice in meetings so it can write the transcript and your notes. Nothing leaves your Mac.
    NSAudioCaptureUsageDescription: Yogurt records the sound of your calls so it can write down what others say. Nothing leaves your Mac.
    NSCalendarsFullAccessUsageDescription: Yogurt reads your calendar to name your notes after the meeting and to know who is in it. Nothing leaves your Mac.
    NSCalendarsUsageDescription: Yogurt reads your calendar to name your notes after the meeting and to know who is in it. Nothing leaves your Mac.
    NSAppleEventsUsageDescription: Yogurt checks the browser tab's name to tell when you're in a call, and pauses your music while it records.
    # macOS 15 and later ask before an app can be found on the local network (Bonjour), which the iPhone app needs
    NSLocalNetworkUsageDescription: Yogurt lets your iPhone find this computer on your Wi-Fi so your notes can sync. Nothing goes through the internet.
    # Electron's own defaults ("This app needs access to..."): Yogurt never asks for these, so plain words instead
    NSCameraUsageDescription: Yogurt doesn't use the camera.
    NSBluetoothAlwaysUsageDescription: Yogurt doesn't use Bluetooth.
    NSBluetoothPeripheralUsageDescription: Yogurt doesn't use Bluetooth.
  # signs with the Developer ID certificate in the keychain (or CSC_LINK on CI); notarized by scripts/release-mac.sh or CI
# Windows and Linux (x86_64 and arm64): unsigned, built by .github/workflows/preview.yml (by hand, or for a release from release.yml).
win:
  # a platform's files list replaces the one above, so it repeats it
  files:
    - out/**
    - package.json
    # this Windows build only needs the x64 Windows engine binaries
    - "!**/node_modules/@node-llama-cpp/{linux,mac,win-arm64}*/**"
    - "!**/node_modules/node-llama-cpp/bins/{linux,mac,win-arm64}*/**"
  # added to the extra resources above (unlike files, these merge): the word list for lowercase respelling (scripts/native.mjs; a Mac has its own)
  extraResources:
    - { from: resources/dict, to: dict }
    # the speed check's clip (src/main/asr/speedCheck.ts): a Mac never times its speech model
    - { from: resources/speed, to: speed }
    # the tray's colour icons (tray.ts; @2x next to them), a Mac uses its template tray.png
    - { from: resources, to: ., filter: ["tray-color*.png", "tray-recording*.png"] }
  artifactName: Yogurt-windows-${arch}.${ext}
  # a release signs the DLLs and native modules too, not just the programs: with Windows Code Integrity on, an unsigned
  # whisper.dll or ggml.dll is blocked from loading and speech setup fails (#99)
  signExts: [".dll", ".node"]
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  # an installer with pages (not one click): where Yogurt goes, then where its AI models go (build/installer.nsh), for a
  # small C: drive. Still per user, no admin prompt; updates install silently as before. The include also carries on
  # when an update's old uninstaller fails (#126)
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  include: build/installer.nsh
  perMachine: false
  # never true: uninstalling would delete every meeting, transcript and recording with the models
  deleteAppDataOnUninstall: false
linux:
  files:
    - out/**
    - package.json
    # this Linux build needs only the engine binaries for the arch it's built on (x64, or arm64 on an arm runner);
    # pnpm installs only that arch's package, so only the platforms Yogurt never ships go
    - "!**/node_modules/@node-llama-cpp/{mac,win,linux-armv7l,linux-riscv}*/**"
    - "!**/node_modules/node-llama-cpp/bins/{mac,win,linux-armv7l,linux-riscv}*/**"
  # the default comes from the package name, which isn't a good file name
  executableName: yogurt
  # added to the extra resources above (unlike files, these merge): the word list for lowercase respelling (scripts/native.mjs; a Mac has its own)
  extraResources:
    - { from: resources/dict, to: dict }
    # the speed check's clip (src/main/asr/speedCheck.ts): a Mac never times its speech model
    - { from: resources/speed, to: speed }
    # the tray's colour icons (tray.ts; @2x next to them), a Mac uses its template tray.png
    - { from: resources, to: ., filter: ["tray-color*.png", "tray-recording*.png"] }
  artifactName: Yogurt-linux-${arch}.${ext}
  # one arch per build: the helpers in resources/bin are built natively for the runner's arch (preview.yml passes --arm64
  # on the arm runner), so never both from one machine
  target:
    - target: AppImage
      arch: [x64]
  # Electron's app_id/WM_CLASS is desktopName minus .desktop: the installed file must use the same name, and
  # StartupWMClass follows it. Without this the .desktop says StartupWMClass=Yogurt but the window is "yogurt".
  syncDesktopName: true
  # one PNG per hicolor size: KDE's icon lookup ignores 1024x1024, which hicolor's index.theme doesn't declare
  icon: build/icons
  category: Office
dmg:
  title: Yogurt
  # build/background.png (+ @2x), from build/dmg-background.svg
  background: build/background.png
  iconSize: 128
  window: { width: 660, height: 400 }
  contents:
    - { x: 180, y: 170 }
    - { x: 480, y: 170, type: link, path: /Applications }
  # the disk image is checked when downloaded, not just the app inside
  sign: true
